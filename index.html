<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不動産物件管理システム</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #1a3a5c;
      --primary-light: #2c5282;
      --accent: #d4a017;
      --accent-light: #e8b93d;
      --bg: #f0f4f8;
      --card: #ffffff;
      --sidebar: #1a3a5c;
      --text: #2d3748;
      --text-muted: #718096;
      --border: #e2e8f0;
      --success: #38a169;
      --warning: #dd6b20;
      --danger: #e53e3e;
      --info: #3182ce;
      --radius: 8px;
      --shadow: 0 1px 6px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; height: 100vh; overflow: hidden; font-size: 14px;
    }

    /* ── Sidebar ── */
    .sidebar { width: 210px; background: var(--sidebar); color:#fff; display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar-logo { padding:18px 16px 14px; border-bottom:1px solid rgba(255,255,255,.1); }
    .sidebar-logo .logo-mark { font-size:22px; }
    .sidebar-logo h1 { font-size:13px; font-weight:700; color:var(--accent-light); line-height:1.4; margin-top:4px; }
    .sidebar-logo .sub { font-size:10px; color:rgba(255,255,255,.4); margin-top:2px; }
    .sidebar-nav { flex:1; padding:10px 0; overflow-y:auto; }
    .nav-item {
      display:flex; align-items:center; gap:9px;
      padding:9px 16px; cursor:pointer;
      color:rgba(255,255,255,.65); font-size:13px;
      transition:all .18s; border-left:3px solid transparent;
    }
    .nav-item:hover { background:rgba(255,255,255,.07); color:#fff; }
    .nav-item.active { background:rgba(255,255,255,.11); color:#fff; border-left-color:var(--accent); }
    .nav-icon { font-size:15px; width:18px; text-align:center; }
    .nav-badge {
      margin-left:auto; background:var(--accent); color:#fff;
      font-size:10px; font-weight:700;
      padding:1px 6px; border-radius:10px; min-width:20px; text-align:center;
    }
    .sidebar-footer { padding:12px; border-top:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; gap:6px; }
    .sidebar-footer .btn { width:100%; font-size:11px; justify-content:center; }

    /* ── Main ── */
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
    .topbar {
      background:#fff; border-bottom:1px solid var(--border);
      padding:10px 20px; display:flex; align-items:center; gap:12px;
    }
    .page-title { font-size:15px; font-weight:700; color:var(--primary); white-space:nowrap; }
    .search-wrap {
      flex:1; max-width:340px;
      display:flex; align-items:center; gap:6px;
      background:var(--bg); border:1px solid var(--border);
      border-radius:20px; padding:6px 14px;
    }
    .search-wrap input { border:none; background:transparent; font-size:12px; outline:none; width:100%; color:var(--text); }
    .content { flex:1; overflow-y:auto; padding:18px 20px; }

    /* ── Buttons ── */
    .btn {
      display:inline-flex; align-items:center; gap:5px;
      padding:7px 14px; border-radius:var(--radius);
      border:none; cursor:pointer;
      font-size:13px; font-weight:500;
      transition:opacity .15s, filter .15s; font-family:inherit;
    }
    .btn:hover { filter:brightness(1.08); }
    .btn:active { filter:brightness(.95); }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-accent  { background:var(--accent); color:#fff; }
    .btn-secondary { background:#fff; color:var(--text); border:1px solid var(--border); }
    .btn-danger  { background:var(--danger); color:#fff; }
    .btn-sm  { padding:4px 10px; font-size:12px; }
    .btn-xs  { padding:2px 7px; font-size:11px; border-radius:5px; }

    /* ── Cards ── */
    .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .card-header { padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; font-weight:700; color:var(--primary); }

    /* ── Stats ── */
    .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
    .stat-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; }
    .stat-label { font-size:11px; color:var(--text-muted); }
    .stat-value { font-size:26px; font-weight:800; margin:2px 0; }
    .stat-sub   { font-size:11px; color:var(--text-muted); }

    /* ── Status badges ── */
    .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; }
    .badge-検討中 { background:#ebf8ff; color:#2b6cb0; }
    .badge-申込中 { background:#fffaf0; color:#c05621; }
    .badge-成約   { background:#f0fff4; color:#276749; }
    .badge-見送り { background:#f7fafc; color:#718096; border:1px solid #e2e8f0; }
    .badge-未提案 { background:#f7fafc; color:#a0aec0; border:1px solid #e2e8f0; }
    .badge-type   { background:#edf2f7; color:#4a5568; }

    /* ── Property Grid ── */
    .prop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
    .prop-card {
      background:#fff; border-radius:var(--radius);
      box-shadow:var(--shadow); border:1px solid var(--border);
      cursor:pointer; transition:transform .18s, box-shadow .18s; overflow:hidden;
    }
    .prop-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
    .prop-card-hd {
      background:var(--primary); color:#fff; padding:10px 12px;
      display:flex; align-items:center; justify-content:space-between; gap:6px;
    }
    .prop-card-hd .name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .prop-thumb { height:110px; background:#f7fafc; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .prop-thumb canvas { max-width:100%; max-height:100%; display:block; }
    .prop-thumb .no-pdf { text-align:center; color:var(--text-muted); font-size:11px; line-height:1.8; }
    .prop-body { padding:10px 12px; }
    .prop-location { font-size:11px; color:var(--text-muted); margin-bottom:5px; }
    .prop-price { font-size:17px; font-weight:800; color:var(--primary); margin-bottom:6px; }
    .prop-specs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
    .prop-spec-tag { font-size:10px; background:var(--bg); color:var(--text-muted); padding:2px 6px; border-radius:4px; }
    .prop-customers { font-size:10px; color:var(--text-muted); }
    .prop-card-ft { padding:7px 12px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }

    /* ── Table ── */
    .tbl-wrap { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th { background:var(--bg); padding:9px 12px; font-size:11px; font-weight:700; color:var(--text-muted); text-align:left; border-bottom:2px solid var(--border); white-space:nowrap; }
    td { padding:9px 12px; font-size:12px; border-bottom:1px solid var(--border); vertical-align:middle; }
    tbody tr { cursor:pointer; }
    tbody tr:hover td { background:#f7fbff; }
    tbody tr:last-child td { border-bottom:none; }

    /* ── Filters ── */
    .filter-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
    .f-select { font-size:12px; padding:5px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; cursor:pointer; outline:none; color:var(--text); }
    .view-toggle { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .view-toggle button { padding:5px 10px; border:none; background:#fff; cursor:pointer; font-size:14px; transition:all .15s; }
    .view-toggle button.active { background:var(--primary); color:#fff; }

    /* ── Modal ── */
    .overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.48);
      display:flex; align-items:center; justify-content:center;
      z-index:1000; padding:16px;
    }
    .modal { background:#fff; border-radius:12px; box-shadow:0 16px 48px rgba(0,0,0,.22); width:100%; max-width:660px; max-height:92vh; display:flex; flex-direction:column; }
    .modal-xl { max-width:1020px; }
    .modal-hd { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .modal-title    { font-size:15px; font-weight:700; }
    .modal-subtitle { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .modal-close {
      cursor:pointer; color:var(--text-muted); font-size:20px; line-height:1; flex-shrink:0;
      width:28px; height:28px; display:flex; align-items:center; justify-content:center;
      border-radius:6px; transition:background .15s;
    }
    .modal-close:hover { background:var(--bg); }
    .modal-body { overflow-y:auto; padding:18px 20px; flex:1; }
    .modal-ft { padding:12px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

    /* ── Forms ── */
    .form-sec { margin-bottom:18px; }
    .form-sec-title { font-size:12px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:.5px; padding-bottom:6px; margin-bottom:10px; border-bottom:2px solid var(--accent); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .form-group { margin-bottom:10px; }
    label { display:block; font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:4px; }
    .req { color:var(--danger); }
    input[type=text], input[type=number], input[type=tel], input[type=email], input[type=password],
    select, textarea {
      width:100%; padding:7px 10px;
      border:1px solid var(--border); border-radius:6px;
      font-size:13px; color:var(--text); background:#fff;
      outline:none; transition:border-color .15s, background .3s; font-family:inherit;
    }
    input:focus, select:focus, textarea:focus { border-color:var(--primary-light); }
    textarea { resize:vertical; min-height:76px; }

    /* PDF upload */
    .pdf-drop {
      border:2px dashed var(--border); border-radius:var(--radius);
      padding:18px; text-align:center; cursor:pointer;
      transition:border-color .2s, background .2s;
    }
    .pdf-drop:hover, .pdf-drop.over { border-color:var(--primary); background:#f0f4f8; }
    .pdf-drop-icon { font-size:28px; margin-bottom:6px; }
    .pdf-drop-text { font-size:12px; color:var(--text-muted); }
    .pdf-drop-sub  { font-size:10px; color:#a0aec0; margin-top:3px; }
    .pdf-ready {
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:var(--radius);
      background:#f0fff4; border:1px solid #9ae6b4;
    }
    .pdf-ready .pname { font-size:12px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* Customer select */
    .cust-select-list { border:1px solid var(--border); border-radius:6px; max-height:140px; overflow-y:auto; }
    .cust-select-item { display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:12px; cursor:pointer; }
    .cust-select-item:hover { background:var(--bg); }
    .cust-select-item input { margin:0; cursor:pointer; }

    /* Customer chips */
    .chip-row { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:3px 9px; border-radius:12px; background:var(--primary); color:#fff; cursor:pointer; }
    .chip:hover { background:var(--primary-light); }

    /* Detail layout */
    .detail-cols  { display:grid; grid-template-columns:1fr 300px; gap:18px; }
    .detail-sec   { margin-bottom:14px; }
    .detail-sec-title { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
    .info-grid    { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .info-cell    { background:var(--bg); padding:8px 10px; border-radius:6px; }
    .info-cell .il { font-size:10px; color:var(--text-muted); }
    .info-cell .iv { font-size:13px; font-weight:500; margin-top:2px; }

    /* PDF viewer */
    .pdf-viewer { background:#3a3a3a; border-radius:var(--radius); overflow:hidden; }
    .pdf-tb { background:#2d2d2d; padding:7px 10px; display:flex; align-items:center; gap:8px; }
    .pdf-tb button { background:rgba(255,255,255,.12); border:none; color:#fff; padding:3px 9px; border-radius:4px; cursor:pointer; font-size:12px; font-family:inherit; }
    .pdf-tb button:hover { background:rgba(255,255,255,.22); }
    .pdf-tb .pinfo { color:rgba(255,255,255,.55); font-size:11px; }
    .pdf-canvas-wrap { overflow-y:auto; max-height:460px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; }
    .pdf-canvas-wrap canvas { max-width:100%; box-shadow:0 4px 12px rgba(0,0,0,.35); }
    .pdf-no { padding:28px; text-align:center; color:#888; font-size:12px; }

    /* Progress bars */
    .prog-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
    .prog-bar  { flex:1; background:var(--bg); border-radius:4px; height:5px; overflow:hidden; }
    .prog-fill { height:5px; border-radius:4px; background:var(--primary); }

    /* Toast */
    .toast-wrap { position:fixed; bottom:18px; right:18px; z-index:2000; display:flex; flex-direction:column; gap:7px; }
    .toast { background:#2d3748; color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; box-shadow:0 4px 12px rgba(0,0,0,.2); animation:toastIn .25s ease; pointer-events:none; }
    .toast.ok  { background:var(--success); }
    .toast.err { background:var(--danger); }
    @keyframes toastIn { from { transform:translateX(110%); opacity:0; } to { transform:none; opacity:1; } }

    /* Empty */
    .empty { text-align:center; padding:60px 20px; color:var(--text-muted); }
    .empty-icon  { font-size:44px; margin-bottom:12px; }
    .empty-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; }
    .empty-desc  { font-size:12px; }

    /* ══ AI Auto-fill ══ */
    /* Highlight fields filled by AI */
    .ai-filled {
      border-color: #4299e1 !important;
      background: #ebf8ff !important;
    }

    /* Spinner */
    .spin { display:inline-block; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* AI badge */
    .ai-badge {
      display:inline-flex; align-items:center; gap:3px;
      font-size:10px; padding:2px 7px; border-radius:10px;
      background:#bee3f8; color:#2b6cb0; font-weight:600; white-space:nowrap; flex-shrink:0;
    }

    /* AI hint bar shown in property form */
    .ai-hint-bar {
      display:flex; align-items:center; gap:10px;
      background:#ebf8ff; border:1px solid #bee3f8;
      border-radius:7px; padding:9px 12px; margin-bottom:14px; font-size:12px; color:#2b6cb0;
    }
    .ai-hint-bar.warn {
      background:#fffbeb; border-color:#fef08a; color:#92400e;
    }

    /* Settings form */
    .api-key-input { font-family:monospace; letter-spacing:.04em; }
    .settings-note {
      font-size:11px; color:var(--text-muted);
      background:#fffbeb; border:1px solid #fef08a;
      padding:10px 12px; border-radius:6px; line-height:1.6;
    }

    /* Extracting overlay inside pdf-drop */
    .extracting-inner {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:8px; padding:6px;
    }
    .extracting-inner .ext-spin { font-size:26px; }
    .extracting-inner .ext-label { font-size:12px; color:var(--text-muted); }
    .extracting-inner .ext-fname { font-size:10px; color:#a0aec0; }

    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#cbd5e0; border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:#a0aec0; }

    .pdf-lightbox {
      position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:9999;
      display:flex; flex-direction:column; align-items:center;
    }
    .pdf-lightbox-tb {
      width:100%; background:rgba(0,0,0,.6); padding:8px 16px;
      display:flex; align-items:center; gap:10px; flex-shrink:0;
      color:#fff; font-size:13px;
    }
    .pdf-lightbox-body {
      flex:1; overflow:auto; display:flex; justify-content:center; padding:20px;
    }
    .pdf-lightbox-body canvas { max-width:100%; box-shadow:0 4px 24px rgba(0,0,0,.5); }
  </style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">🏠</div>
    <h1>不動産物件<br>管理システム</h1>
    <div class="sub">Property Manager</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-view="props"  onclick="nav('props')">
      <span class="nav-icon">🏢</span><span>物件一覧</span>
      <span class="nav-badge" id="nb-props">0</span>
    </div>
    <div class="nav-item" data-view="custs"  onclick="nav('custs')">
      <span class="nav-icon">👥</span><span>顧客管理</span>
      <span class="nav-badge" id="nb-custs">0</span>
    </div>
    <div class="nav-item" data-view="agents" onclick="nav('agents')">
      <span class="nav-icon">🏪</span><span>業者管理</span>
      <span class="nav-badge" id="nb-agents">0</span>
    </div>
    <div class="nav-item" data-view="dash"   onclick="nav('dash')">
      <span class="nav-icon">📊</span><span>ダッシュボード</span>
    </div>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-accent btn-sm"     onclick="showSettings()">✨ AI自動入力設定</button>
    <button class="btn btn-secondary btn-sm"  onclick="exportAll()">💾 データ書き出し</button>
    <button class="btn btn-secondary btn-sm"  onclick="importAll()">📥 データ読み込み</button>
    <input type="file" id="imp-file" accept=".json" style="display:none" onchange="onImport(event)">
  </div>
</div>

<!-- ════════════════ MAIN ════════════════ -->
<div class="main">
  <div class="topbar">
    <div class="page-title" id="pg-title">物件一覧</div>
    <div class="search-wrap">
      <span style="font-size:13px;color:var(--text-muted)">🔍</span>
      <input type="text" id="srch" placeholder="物件名・所在地・業者名…" oninput="onSearch()">
    </div>
    <button class="btn btn-accent" id="add-btn" onclick="onAdd()">＋ 新規登録</button>
  </div>
  <div class="content" id="cnt"></div>
</div>

<div class="toast-wrap" id="toasts"></div>
<div id="mc"></div>

<!-- ═══════════════ SCRIPT ═══════════════ -->
<script>
/* ─── PDF.js ─── */
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

/* ══════════════════════════════════════════════
   IndexedDB (PDF binary storage)
══════════════════════════════════════════════ */
let idb = null;
function openIDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('fudosanPDFs', 2);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('pdfs'))
        db.createObjectStore('pdfs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('docs'))
        db.createObjectStore('docs', { keyPath: 'id' }); // {id: uid, propId, fileName, data}
    };
    r.onsuccess = e => { idb = e.target.result; res(); };
    r.onerror   = () => rej(r.error);
  });
}
function dbSave(id, fileName, data) {
  return new Promise((res, rej) => {
    if (!idb) { res(); return; }
    const tx = idb.transaction('pdfs', 'readwrite');
    tx.objectStore('pdfs').put({ id, fileName, data });
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
function dbGet(id) {
  return new Promise(res => {
    if (!idb) { res(null); return; }
    const r = idb.transaction('pdfs', 'readonly').objectStore('pdfs').get(id);
    r.onsuccess = () => res(r.result || null);
    r.onerror   = () => res(null);
  });
}
function dbDel(id) {
  return new Promise(res => {
    if (!idb) { res(); return; }
    const tx = idb.transaction('pdfs', 'readwrite');
    tx.objectStore('pdfs').delete(id);
    tx.oncomplete = res; tx.onerror = res;
  });
}
function dbDocSave(doc) {
  return new Promise((res,rej) => {
    if (!idb) { res(); return; }
    const tx = idb.transaction('docs','readwrite');
    tx.objectStore('docs').put(doc);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
function dbDocList(propId) {
  return new Promise(res => {
    if (!idb) { res([]); return; }
    const docs = [];
    const tx   = idb.transaction('docs','readonly');
    tx.objectStore('docs').openCursor().onsuccess = e => {
      const cur = e.target.result;
      if (cur) { if (cur.value.propId === propId) docs.push(cur.value); cur.continue(); }
      else res(docs);
    };
  });
}
function dbDocDel(docId) {
  return new Promise(res => {
    if (!idb) { res(); return; }
    const tx = idb.transaction('docs','readwrite');
    tx.objectStore('docs').delete(docId);
    tx.oncomplete = res; tx.onerror = res;
  });
}

// APIキーで実際に使えるモデル一覧を取得
async function fetchAvailableGeminiModels(apiKey) {
  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}&pageSize=100`,
      { headers: { 'content-type': 'application/json' } }
    );
    if (!res.ok) return null;
    const data = await res.json();
    return (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace('models/', ''))
      // Flash系を優先（高速・低コスト）
      .sort((a, b) => {
        const score = s => s.includes('flash') ? 0 : s.includes('lite') ? 1 : 2;
        return score(a) - score(b);
      });
  } catch(_) { return null; }
}

/* ══════════════════════════════════════════════
   PDF → Base64 image  (for AI input)
══════════════════════════════════════════════ */
async function pdfToImage(arrayBuffer) {
  if (typeof pdfjsLib === 'undefined') return null;
  const pdf  = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
  const page = await pdf.getPage(1);
  const vp0  = page.getViewport({ scale: 1 });
  const scale = Math.min(2.5, 1400 / vp0.width);
  const vp   = page.getViewport({ scale });
  const cv   = document.createElement('canvas');
  cv.width   = vp.width; cv.height = vp.height;
  await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  return cv.toDataURL('image/jpeg', 0.85).split(',')[1];
}

/* ══════════════════════════════════════════════
   PDF text extraction  (supplement for AI)
══════════════════════════════════════════════ */
async function pdfToText(arrayBuffer) {
  if (typeof pdfjsLib === 'undefined') return '';
  try {
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
    let text = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 2); i++) {
      const page    = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(x => x.str).join(' ') + '\n';
    }
    return text.trim();
  } catch(_) { return ''; }
}

/* ══════════════════════════════════════════════
   AI Extraction  (calls Claude API)
══════════════════════════════════════════════ */
async function aiExtract(arrayBuffer) {
  const { apiKey, model, provider } = getCfg();
  if (!apiKey) throw new Error('NO_KEY');

  // ArrayBufferをコピーして渡す（Worker転送後に detach されるため）
  const imgB64     = await pdfToImage(arrayBuffer.slice(0));
  const textContent = await pdfToText(arrayBuffer.slice(0));

  const PROMPT = `この不動産の販売図面（物件資料）から情報を抽出してください。
${textContent ? `\n【PDF抽出テキスト（参考）】\n${textContent.slice(0, 2500)}\n` : ''}
必ず以下のJSON形式のみで返答してください。説明文・コードブロック（\`\`\`）・改行・前置きは一切不要です。JSONオブジェクトのみ出力してください:
{
  "name": "物件名または号室名（例：○○マンション 101号室）",
  "type": "種別（マンション/一戸建て/土地/店舗/その他 のいずれか）",
  "location": "所在地（都道府県から）",
  "price": 価格（万円の整数。例3500。不明ならnull）,
  "layout": "間取り（例：2LDK。なければnull）",
  "landArea": 土地面積（㎡の数値。なければnull）,
  "buildArea": 建物面積・床面積（㎡の数値。なければnull）,
  "age": 築年数（整数。例10。新築なら0。不明ならnull）,
  "structure": "構造（鉄筋コンクリート/鉄骨造/木造/その他 のいずれか。なければnull）",
  "extra": "その他特記事項（向き・階数・駅徒歩等を簡潔に。なければnull）",
  "cityPlan": "都市計画（市街化区域等。なければnull）",
  "useZone": "用途地域（第一種低層住居専用地域等。なければnull）",
  "coverageRatio": 建ぺい率（%の整数。例60。なければnull）,
  "floorRatio": 容積率（%の整数。例200。なければnull）,
  "road": "接道状況（なければnull）",
  "setback": "セットバック（あり/なし。なければnull）",
  "sellerName": "売主業者名（なければnull）",
  "brokerName": "媒介業者名（売主と同じ場合はnull）",
  "contactName": "担当者名（なければnull）",
  "contactPhone": "担当者電話番号（なければnull）"
}`;

  let txt = '';

  if (provider === 'claude') {
    /* ── Anthropic Claude ── */
    const content = [];
    if (imgB64) {
      content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: imgB64 } });
    }
    content.push({ type: 'text', text: PROMPT });

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: model || 'claude-3-5-haiku-20241022',
        max_tokens: 1024,
        messages: [{ role: 'user', content }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `Claudeエラー ${res.status}`);
    }

    const data = await res.json();
    txt = data.content?.[0]?.text || '';

  } else {
    /* ── Google Gemini（動的モデル取得 + 自動フォールバック）── */
    const parts = [];
    if (imgB64) {
      parts.push({ inline_data: { mime_type: 'image/jpeg', data: imgB64 } });
    }
    parts.push({ text: PROMPT });

    // 実際に使えるモデルをAPIから取得し、それを優先する
    const availableModels = await fetchAvailableGeminiModels(apiKey);
    const preferred = model || 'gemini-2.0-flash-lite';
    let tryCandidates;
    if (availableModels && availableModels.length > 0) {
      // 取得成功：利用可能モデルを優先、念のため固定リストも末尾に追加
      tryCandidates = [
        ...availableModels,
        ...GEMINI_FALLBACKS.filter(m => !availableModels.includes(m))
      ];
      // 設定で選んだモデルが利用可能なら先頭に
      if (availableModels.includes(preferred)) {
        tryCandidates = [preferred, ...tryCandidates.filter(m => m !== preferred)];
      }
    } else {
      // 取得失敗：固定リストで試す
      tryCandidates = [preferred, ...GEMINI_FALLBACKS.filter(m => m !== preferred)];
    }
    let lastErr = null;

    for (const tryModel of tryCandidates) {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${tryModel}:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts }],
            generationConfig: { temperature: 0.1, maxOutputTokens: 1536, responseMimeType: 'application/json' }
          })
        }
      );

      if (res.ok) {
        const data = await res.json();
        txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        break; // success
      }

      const err = await res.json().catch(() => ({}));
      const msg = err.error?.message || '';
      // If model is unavailable, try next; otherwise throw immediately
      if (msg.includes('no longer available') || msg.includes('not found') ||
          msg.includes('not supported') || res.status === 404 || res.status === 400 && msg.includes('model')) {
        lastErr = new Error(`モデル ${tryModel} が利用不可`);
        continue;
      }
      throw new Error(msg || `Geminiエラー ${res.status}`);
    }

    if (!txt && lastErr) {
      throw new Error(
        '利用可能なGeminiモデルが見つかりませんでした。\n' +
        'AI自動入力設定でAnthropicClaudeに切り替えるか、' +
        'Google AI Studioで請求設定が完了しているか確認してください。'
      );
    }
  }

  // ① マークダウンのコードブロックを除去
  const cleaned = txt
    .replace(/```(?:json)?\s*/gi, '')
    .replace(/```/g, '')
    .trim();

  // ② JSON オブジェクトを探す
  const match = cleaned.match(/\{[\s\S]*\}/);
  if (match) {
    try {
      return JSON.parse(match[0]);
    } catch(_) {
      // trailing comma 等を除去して再試行
      try {
        return JSON.parse(match[0].replace(/,\s*([}\]])/g, '$1'));
      } catch(_2) { /* fall through to list parser */ }
    }
  }

  // ③ フォールバック：番号付きリスト形式を解析
  //    例： 17. `sellerName`: null  /  18. `brokerName`: "株式会社XX"
  const KEYS = ['name','type','location','price','layout','landArea','buildArea',
    'age','structure','extra','sellerName','brokerName','contactName','contactPhone',
    'cityPlan','useZone','coverageRatio','floorRatio','road','setback'];

  const obj = {};
  for (const key of KEYS) {
    // バッククォートあり・なし両方、値はnull/文字列/数値
    const re = new RegExp(`\`?${key}\`?[：:：]\\s*(\`([^"\`\n]*)\`|"([^"\n]*)"|null|(\\d+\\.?\\d*))`, 'i');
    const m2 = cleaned.match(re);
    if (!m2) continue;
    const raw = m2[2] ?? m2[3] ?? m2[4];
    if (raw == null) { obj[key] = null; continue; }
    const num = Number(raw);
    obj[key] = (raw !== '' && !isNaN(num)) ? num : raw;
  }

  if (Object.keys(obj).length > 0) return obj;

  // ④ 全て失敗した場合のエラー
  const preview = txt.slice(0, 150).replace(/\n/g, ' ');
  throw new Error(`AI応答からJSONを取得できませんでした。応答内容：${preview}`);
}

/* ══════════════════════════════════════════════
   Fill form with extracted info
══════════════════════════════════════════════ */
function fillFormFromInfo(info) {
  const setVal = (id, val) => {
    const el = document.getElementById(id);
    if (!el || val == null || val === '') return;
    el.value = val;
    el.classList.add('ai-filled');
  };

  setVal('p-name',       info.name);
  setVal('p-type',       info.type);
  setVal('p-loc',        info.location);
  setVal('p-price',      info.price);
  setVal('p-layout',     info.layout);
  setVal('p-land-area',  info.landArea);
  setVal('p-build-area', info.buildArea);
  setVal('p-age',        info.age);
  setVal('p-struct',     info.structure);
  setVal('p-extra',      info.extra);
  setVal('p-city-plan',  info.cityPlan);
  setVal('p-use-zone',   info.useZone);
  setVal('p-coverage',   info.coverageRatio);
  setVal('p-floor-ratio',info.floorRatio);
  setVal('p-road',       info.road);
  setVal('p-setback',    info.setback);
  setVal('p-cname',      info.contactName);
  setVal('p-cphone',     info.contactPhone);

  // Agent matching helper
  const newAgents = [];
  const matchOrCreateAgent = (name, selectId) => {
    if (!name) return;
    const norm = n => n.replace(/[　\s]/g,'').toLowerCase();
    let found = D.agents.find(a => norm(a.name) === norm(name));
    if (!found) found = D.agents.find(a => a.name.includes(name) || name.includes(a.name));
    if (found) {
      const el = document.getElementById(selectId);
      if (el) { el.value = found.id; el.classList.add('ai-filled'); }
    } else {
      // Auto-register as new agent
      const ag = { id: uid(), name, ts: Date.now() };
      D.agents.push(ag); newAgents.push(name);
      save();
      // Add to select and choose it
      const el = document.getElementById(selectId);
      if (el) {
        const opt = document.createElement('option');
        opt.value = ag.id; opt.textContent = name;
        el.appendChild(opt);
        el.value = ag.id;
        el.classList.add('ai-filled');
      }
    }
  };

  matchOrCreateAgent(info.sellerName, 'p-seller');
  matchOrCreateAgent(info.brokerName, 'p-broker');

  if (newAgents.length) {
    setTimeout(() => toast(`業者「${newAgents.join('」「')}」を自動登録しました`, 'ok'), 500);
  }
}

async function loadThumb(id) {
  const el = document.getElementById(`th-${id}`);

async function renderPDFPage() {
  if (!_pdf) return;
  const wrap = document.getElementById('pcw'); if (!wrap) return;
  const page = await _pdf.doc.getPage(_pdf.page);
  const w    = (wrap.clientWidth || 260) - 24;
  const vp0  = page.getViewport({ scale: 1 });
  const sc   = Math.min(w / vp0.width, 2.5);
  const vp   = page.getViewport({ scale: sc });
  const cv   = document.createElement('canvas');
  cv.width   = vp.width; cv.height = vp.height;
  await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  wrap.innerHTML = ''; wrap.appendChild(cv);
  const pi = document.getElementById('pinfo');
  if (pi) pi.textContent = `${_pdf.page} / ${_pdf.doc.numPages}`;
}
async function pdfNav(d) {
  if (!_pdf) return;
  _pdf.page = Math.max(1, Math.min(_pdf.doc.numPages, _pdf.page + d));
  await renderPDFPage();
}
async function downloadPDF(id) {
  const rec = await dbGet(id);
  if (!rec) { toast('PDFが見つかりません', 'err'); return; }
  const blob = new Blob([rec.data], { type: 'application/pdf' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = rec.fileName || 'document.pdf';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

let _lb = { doc: null, page: 1 };
async function openPDFLightbox(id) {
  const rec = await dbGet(id);
  if (!rec || typeof pdfjsLib === 'undefined') { toast('PDFが読み込めません','err'); return; }
  _lb.doc  = await pdfjsLib.getDocument({ data: new Uint8Array(rec.data) }).promise;
  _lb.page = 1;
  const div = document.createElement('div');
  div.className = 'pdf-lightbox';
  div.id = 'pdf-lb';
  div.innerHTML = `
    <div class="pdf-lightbox-tb">
      <button onclick="lbNav(-1)" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer">◀</button>
      <span id="lb-info">1 / ${_lb.doc.numPages}</span>
      <button onclick="lbNav(1)"  style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer">▶</button>
      <span style="flex:1"></span>
      <button onclick="downloadPDF('${id}')" style="background:var(--accent);color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px">⬇ ダウンロード</button>
      <button onclick="document.getElementById('pdf-lb').remove()" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:16px">✕</button>
    </div>
    <div class="pdf-lightbox-body" id="lb-body"></div>`;
  document.body.appendChild(div);
  await lbRender();
}
async function lbRender() {
  if (!_lb.doc) return;
  const body = document.getElementById('lb-body'); if (!body) return;
  const page = await _lb.doc.getPage(_lb.page);
  const w    = Math.min(window.innerWidth - 40, 1200);
  const vp0  = page.getViewport({ scale: 1 });
  const sc   = w / vp0.width;
  const vp   = page.getViewport({ scale: sc });
  const cv   = document.createElement('canvas');
  cv.width = vp.width; cv.height = vp.height;
  await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  body.innerHTML = ''; body.appendChild(cv);
  const info = document.getElementById('lb-info');
  if (info) info.textContent = `${_lb.page} / ${_lb.doc.numPages}`;
}
async function lbNav(d) {
  if (!_lb.doc) return;
  _lb.page = Math.max(1, Math.min(_lb.doc.numPages, _lb.page + d));
  await lbRender();
}

async function addDocs(propId, files) {
  for (const f of files) {
    const data = await f.arrayBuffer();
    await dbDocSave({ id: uid(), propId, fileName: f.name, data, ts: Date.now() });
  }
  toast(`${files.length}件の資料を追加しました`, 'ok');
  await loadDocs(propId);
}
async function loadDocs(propId) {
  const el = document.getElementById('doc-list'); if (!el) return;
  const docs = await dbDocList(propId);
  if (!docs.length) { el.innerHTML = '<div style="color:var(--text-muted);font-size:12px">資料がありません</div>'; return; }
  el.innerHTML = docs.sort((a,b)=>b.ts-a.ts).map(d => `
    <div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--border)">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(d.fileName)}">📄 ${esc(d.fileName)}</span>
      <button onclick="downloadDoc('${d.id}')" style="background:var(--accent);color:#fff;border:none;border-radius:3px;padding:2px 6px;font-size:10px;cursor:pointer">⬇</button>
      <button onclick="deleteDoc('${d.id}','${propId}')" style="background:var(--danger);color:#fff;border:none;border-radius:3px;padding:2px 6px;font-size:10px;cursor:pointer">✕</button>
    </div>`).join('');
}
async function downloadDoc(docId) {
  const tx  = idb.transaction('docs','readonly');
  const req = tx.objectStore('docs').get(docId);
  req.onsuccess = () => {
    const d = req.result; if (!d) return;
    const blob = new Blob([d.data]);
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = d.fileName;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };
}
async function deleteDoc(docId, propId) {
  if (!confirm('この資料を削除しますか？')) return;
  await dbDocDel(docId);
  toast('資料を削除しました', 'ok');
  await loadDocs(propId);
}

async function delProp(id) {
  if (!confirm('この物件を削除しますか？')) return;
  D.properties = D.properties.filter(p => p.id !== id);
  await dbDel(id);
  save(); closeModal(); toast('物件を削除しました', 'ok'); renderProps();
}

/* ══ Main entry: file selected → maybe AI extract ══ */
async function setPending(f) {
  _pendingFile = f;
  const { apiKey } = getCfg();
  const d = document.getElementById('pdf-disp');

  if (apiKey) {
    // Show extracting spinner
    if (d) d.innerHTML = `
      <div class="extracting-inner">
        <div class="ext-spin spin">⏳</div>
        <div class="ext-label">✨ AIが販売図面を読み取っています…</div>
        <div class="ext-fname">${esc(f.name)}</div>
      </div>`;

    try {
      const buffer = await f.arrayBuffer();
      const info   = await aiExtract(buffer);
      fillFormFromInfo(info);
      toast('✨ AIが情報を自動入力しました。内容をご確認ください。', 'ok');
      if (d) d.innerHTML = `
        <div class="pdf-ready">
          <span style="font-size:24px">📄</span>
          <span class="pname">${esc(f.name)}</span>
          <span class="ai-badge">✨ AI入力済み</span>
        </div>`;
    } catch(e) {
      const isNoKey  = e.message === 'NO_KEY';
      const errLabel = isNoKey ? 'APIキー未設定' : e.message;
      console.error('AI extract error:', e);
      toast(`自動入力に失敗しました（${errLabel}）`, 'err');
      if (d) d.innerHTML = `
        <div class="pdf-ready" style="background:#fff5f5;border-color:#feb2b2">
          <span style="font-size:24px">📄</span>
          <span class="pname">${esc(f.name)}</span>
          <span style="font-size:10px;color:var(--danger);flex-shrink:0">自動入力失敗</span>
        </div>`;
    }
  } else {
    // No API key – just show file selected
    if (d) d.innerHTML = `
      <div class="pdf-ready">
        <span style="font-size:24px">📄</span>
        <span class="pname">${esc(f.name)}</span>
        <span style="font-size:10px;color:var(--success);flex-shrink:0">✓ 選択済み</span>
      </div>`;
  }
}

  const prop = {

    location:     document.getElementById('p-loc').value.trim(),
    price:        document.getElementById('p-price').value,

    landArea:      document.getElementById('p-land-area').value,
    buildArea:     document.getElementById('p-build-area').value,
    cityPlan:      document.getElementById('p-city-plan').value,
    useZone:       document.getElementById('p-use-zone').value,
    coverageRatio: document.getElementById('p-coverage').value,
    floorRatio:    document.getElementById('p-floor-ratio').value,
    road:          document.getElementById('p-road').value.trim(),
    setback:       document.getElementById('p-setback').value,
    age:           document.getElementById('p-age').value,
    structure:    document.getElementById('p-struct').value,
    extra:        document.getElementById('p-extra').value.trim(),
    sellerId:     document.getElementById('p-seller').value,
    brokerId:     document.getElementById('p-broker').value,
    contactName:  document.getElementById('p-cname').value.trim(),
    contactPhone: document.getElementById('p-cphone').value.trim(),
    custIds, notes: document.getElementById('p-notes').value.trim(),
    updAt: Date.now()
  };
  const ex = D.properties.find(p => p.id === prop.id);
  if (ex) { prop.ts = ex.ts; Object.assign(ex, prop); }
  else     { prop.ts = Date.now(); D.properties.push(prop); }

  if (_pendingFile) {
    await dbSave(prop.id, _pendingFile.name, await _pendingFile.arrayBuffer());
  }
  save(); closeModal();
  toast(`物件を${editId ? '更新' : '登録'}しました`, 'ok');
  renderProps();
}

function saveCust(editId) {
  const name = document.getElementById('c-name').value.trim();
  if (!name) { toast('顧客名を入力してください', 'err'); return; }
  const cust = {
    id: editId || uid(), name,
    phone: document.getElementById('c-phone').value.trim(),
    email: document.getElementById('c-email').value.trim(),
    notes: document.getElementById('c-notes').value.trim()
  };
  const ex = D.customers.find(c => c.id === cust.id);
  if (ex) { cust.ts = ex.ts; Object.assign(ex, cust); }
  else     { cust.ts = Date.now(); D.customers.push(cust); }
  save(); closeModal(); toast(`顧客を${editId ? '更新' : '登録'}しました`, 'ok'); renderCusts();
}
function delCust(id) {
  if (!confirm('この顧客を削除しますか？\n物件との紐付けも解除されます。')) return;
  D.customers = D.customers.filter(c => c.id !== id);
  D.properties.forEach(p => { p.custIds = (p.custIds||[]).filter(x => x !== id); });
  save(); toast('顧客を削除しました', 'ok'); renderCusts();
}

/* ══════════════════════════════════════════════
   AGENTS
══════════════════════════════════════════════ */
function renderAgents() {
  let list = D.agents.filter(a => {
    if (!q) return true;
    return `${a.name} ${a.phone} ${a.email} ${a.contact}`.toLowerCase().includes(q);
  }).sort((a,b)=>(b.ts||0)-(a.ts||0));

  let h = `<div class="tbl-wrap"><table>
    <thead><tr>
      <th>業者名</th><th>種別</th><th>電話番号</th>
      <th>担当者名</th><th>メール</th><th>売主物件</th><th>媒介物件</th><th></th>
    </tr></thead><tbody>`;

  if (!list.length) {
    h += `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">業者が登録されていません</td></tr>`;
  }
  list.forEach(a => {
    const sc = D.properties.filter(p => p.sellerId === a.id).length;
    const bc = D.properties.filter(p => p.brokerId === a.id).length;
    h += `<tr onclick="filterByAgent('${a.id}')">
      <td><strong>${esc(a.name)}</strong></td>
      <td>${a.type?`<span class="badge badge-type">${esc(a.type)}</span>`:'-'}</td>
      <td>${esc(a.phone||'-')}</td>
      <td>${esc(a.contact||'-')}</td>
      <td style="font-size:11px">${esc(a.email||'-')}</td>
      <td>${sc>0?`<span style="background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px">${sc}件</span>`:'-'}</td>
      <td>${bc>0?`<span style="background:#6b46c1;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px">${bc}件</span>`:'-'}</td>
      <td onclick="event.stopPropagation()">
        <button class="btn btn-secondary btn-xs" onclick="showAgentModal('${a.id}')">編集</button>
        <button class="btn btn-danger btn-xs" onclick="delAgent('${a.id}')">削除</button>
      </td>
    </tr>`;
  });
  h += `</tbody></table></div>`;
  document.getElementById('cnt').innerHTML = h;
}
function filterByAgent(id) { pf.agentId = id; nav('props'); }

function showAgentModal(editId = '') {
  const a = editId ? D.agents.find(x => x.id === editId) : null;
  const TYPES = ['売主業者','媒介業者','両方'];
  showModal(`
    <div class="modal">
      <div class="modal-hd">
        <div class="modal-title">${a ? '業者を編集' : '業者を登録'}</div>
        <span class="modal-close" onclick="closeModal()">✕</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>業者名 <span class="req">*</span></label>
          <input type="text" id="a-name" value="${ea(a?.name||'')}" placeholder="例：○○不動産株式会社">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>種別</label>
            <select id="a-type">
              <option value="">選択</option>
              ${TYPES.map(t=>`<option value="${t}" ${a?.type===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>電話番号</label>
            <input type="tel" id="a-phone" value="${ea(a?.phone||'')}" placeholder="000-0000-0000">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>担当者名</label>
            <input type="text" id="a-contact" value="${ea(a?.contact||'')}" placeholder="担当者名">
          </div>
          <div class="form-group">
            <label>メールアドレス</label>
            <input type="email" id="a-email" value="${ea(a?.email||'')}" placeholder="example@co.jp">
          </div>
        </div>
        <div class="form-group">
          <label>備考</label>
          <textarea id="a-notes" placeholder="備考…">${esc(a?.notes||'')}</textarea>
        </div>
      </div>
      <div class="modal-ft">
        <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveAgent('${editId}')">
          ${a ? '更新する' : '登録する'}
        </button>
      </div>
    </div>`);
}
function saveAgent(editId) {
  const name = document.getElementById('a-name').value.trim();
  if (!name) { toast('業者名を入力してください', 'err'); return; }
  const agent = {
    id: editId || uid(), name,
    type:    document.getElementById('a-type').value,
    phone:   document.getElementById('a-phone').value.trim(),
    contact: document.getElementById('a-contact').value.trim(),
    email:   document.getElementById('a-email').value.trim(),
    notes:   document.getElementById('a-notes').value.trim()
  };
  const ex = D.agents.find(a => a.id === agent.id);
  if (ex) { agent.ts = ex.ts; Object.assign(ex, agent); }
  else     { agent.ts = Date.now(); D.agents.push(agent); }
  save(); closeModal(); toast(`業者を${editId ? '更新' : '登録'}しました`, 'ok'); renderAgents();
}
function delAgent(id) {
  if (!confirm('この業者を削除しますか？\n物件との紐付けも解除されます。')) return;
  D.agents = D.agents.filter(a => a.id !== id);
  D.properties.forEach(p => {
    if (p.sellerId === id) p.sellerId = '';
    if (p.brokerId === id) p.brokerId = '';
  });
  save(); toast('業者を削除しました', 'ok'); renderAgents();
}

/* ══════════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════════ */
function renderDash() {
  const P   = D.properties;
  const cnt = s => P.filter(p => (p.status||'未提案') === s).length;
  const STATUSES = ['未提案','検討中','申込中','成約','見送り'];

  const cpMap = {};
  P.forEach(p => (p.custIds||[]).forEach(id => { cpMap[id] = (cpMap[id]||0)+1; }));
  const topCusts = Object.entries(cpMap).sort(([,a],[,b])=>b-a).slice(0,5);

  const apMap = {};
  P.forEach(p => {
    if (p.sellerId) apMap[p.sellerId] = (apMap[p.sellerId]||0)+1;
    if (p.brokerId && p.brokerId !== p.sellerId) apMap[p.brokerId] = (apMap[p.brokerId]||0)+1;
  });
  const topAgents = Object.entries(apMap).sort(([,a],[,b])=>b-a).slice(0,5);
  const recent    = [...P].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,6);

  document.getElementById('cnt').innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">総物件数</div>
        <div class="stat-value" style="color:var(--primary)">${P.length}</div>
        <div class="stat-sub">件登録済み</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">検討中</div>
        <div class="stat-value" style="color:#2b6cb0">${cnt('検討中')}</div>
        <div class="stat-sub">件</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">申込中</div>
        <div class="stat-value" style="color:#c05621">${cnt('申込中')}</div>
        <div class="stat-sub">件</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">成約済み</div>
        <div class="stat-value" style="color:var(--success)">${cnt('成約')}</div>
        <div class="stat-sub">件</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="card">
        <div class="card-header">ステータス別内訳</div>
        <div style="padding:14px 16px">
          ${STATUSES.map(s => {
            const n = cnt(s);
            return `<div class="prog-row">
              <span class="badge badge-${s}" style="min-width:60px;text-align:center">${s}</span>
              <div class="prog-bar"><div class="prog-fill" style="width:${P.length?n/P.length*100:0}%"></div></div>
              <span style="font-size:13px;font-weight:700;min-width:24px;text-align:right">${n}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-header">最近の登録物件</div>
        ${recent.length ? recent.map(p=>`
          <div style="padding:9px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center"
               onclick="nav('props');setTimeout(()=>showPropDetail('${p.id}'),50)">
            <div>
              <div style="font-size:12px;font-weight:600">${esc(p.name||'未設定')}</div>
              <div style="font-size:10px;color:var(--text-muted)">${p.ts?new Date(p.ts).toLocaleDateString('ja-JP'):'-'} 登録</div>
            </div>
            <span class="badge badge-${p.status||'未提案'}">${p.status||'未提案'}</span>
          </div>`).join('')
        : '<div style="padding:20px;color:var(--text-muted);font-size:12px;text-align:center">物件がありません</div>'}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="card-header">顧客別 提案件数 TOP 5</div>
        ${topCusts.length ? topCusts.map(([id,n])=>{
          const c = D.customers.find(x=>x.id===id); if (!c) return '';
          return `<div style="padding:9px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer"
                       onclick="filterByCust('${id}')">
            <span style="font-size:12px">👤 ${esc(c.name)}</span>
            <span style="background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px">${n}件</span>
          </div>`;
        }).join('') : '<div style="padding:20px;color:var(--text-muted);font-size:12px;text-align:center">データなし</div>'}
      </div>
      <div class="card">
        <div class="card-header">業者別 物件数 TOP 5</div>
        ${topAgents.length ? topAgents.map(([id,n])=>{
          const a = D.agents.find(x=>x.id===id); if (!a) return '';
          return `<div style="padding:9px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer"
                       onclick="filterByAgent('${id}')">
            <span style="font-size:12px">🏪 ${esc(a.name)}</span>
            <span style="background:#6b46c1;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px">${n}件</span>
          </div>`;
        }).join('') : '<div style="padding:20px;color:var(--text-muted);font-size:12px;text-align:center">データなし</div>'}
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   Export / Import
══════════════════════════════════════════════ */
function exportAll() {
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `不動産データ_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'-')}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('データをエクスポートしました', 'ok');
}
function importAll() { document.getElementById('imp-file').click(); }
function onImport(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (!d.properties || !d.customers || !d.agents) { toast('無効なデータ形式です', 'err'); return; }
      if (confirm('既存データを上書きして読み込みますか？\n（PDFデータは引き継がれません）')) {
        D = d; save(); render(); toast('データを読み込みました', 'ok');
      }
    } catch(_) { toast('ファイルの読み込みに失敗しました', 'err'); }
  };
  r.readAsText(f); e.target.value = '';
}

/* ── Bootstrap ── */
openIDB().then(() => { refreshBadges(); render(); });
</script>
